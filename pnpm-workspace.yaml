allowBuilds:
  '@fabdeh/eslint-config': false
  '@parcel/watcher': false
  esbuild: false
  lmdb: false
  msgpackr-extract: false
  sharp: false
  simple-git-hooks: false
  unrs-resolver: false
  workerd: false
trustPolicyIgnoreAfter: 43200 # 30 days
trustLockfile: true
blockExoticSubdeps: true
includeWorkspaceRoot: true
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@fabdeh/*'

shellEmulator: true
trustPolicy: no-downgrade
packages:
  - worker

overrides:
  '@angular/build': $@angular/build # remove once @ngrx/* and @angular-architects/ngrx-toolkit are updated to support Angular 22
  '@angular/common': $@angular/common # remove once @ngrx/* and @angular-architects/ngrx-toolkit are updated to support Angular 22
  '@angular/core': $@angular/core # remove once @ngrx/* and @angular-architects/ngrx-toolkit are updated to support Angular 22
