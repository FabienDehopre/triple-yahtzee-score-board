<div class="relative min-h-screen bg-gray-100 px-4 py-8">
  <div class="mx-auto max-w-5xl">
    <div class="mb-4 flex items-center justify-between">
      <app-language-picker />
      <div class="text-center">
        <h1 class="text-3xl font-bold text-indigo-600">{{ 'app.title' | transloco }}</h1>
        <p class="mt-1 text-sm text-gray-500">{{ 'app.subtitle' | transloco }}</p>
      </div>
      <!-- spacer to balance the layout -->
      <div class="invisible"><app-language-picker /></div>
    </div>

    <div class="mb-4 flex items-start justify-between gap-4">
      <app-clear-session-button />
      <app-game-count-picker />
    </div>

    <div class="mb-6 rounded-2xl bg-white p-6 shadow-lg">
      <h2 class="
        mb-4 text-sm font-semibold tracking-wide text-gray-500 uppercase
      ">{{ 'scoreSheet.enterDiceRoll' | transloco }}</h2>
      <app-dice-input (confirmed)="onDiceConfirmed($event)" />
    </div>

    <app-suggestion-bar class="mb-4 block" />

    <app-score-sheet />
    <app-undo-banner />
    <app-footer />
    <app-report-issue-button />
  </div>

  <app-toast />

  @if (isGameOver()) {
  <div class="fixed inset-0 z-50" data-testid="game-over-overlay">
    <app-game-over />
  </div>
  }
</div>
