<select
  class="
    rounded-lg border border-gray-300 bg-white px-3 py-1.5 text-sm font-medium
    text-gray-700 shadow-sm
    focus:border-indigo-500 focus:ring-2 focus:ring-indigo-300
    focus-visible:outline-none
  "
  [attr.aria-label]="'languagePicker.ariaLabel' | transloco"
  (change)="onLangChange($event)"
>
  @for (lang of availableLangs; track lang) {
  <option [selected]="activeLang() === lang" [value]="lang">
    {{ 'languagePicker.' + lang | transloco }}
  </option>
  }
</select>
