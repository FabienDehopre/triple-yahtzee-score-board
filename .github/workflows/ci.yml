name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # actions/cache archives paths relative to the workspace, which differs between the host and the e2e container.
  # A store inside the workspace restores to the same place in both.
  pnpm_config_store_dir: .pnpm-store

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .pnpm-store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm fetch
      - run: du -sh "$(pnpm store path)"

  lint:
    runs-on: ubuntu-latest
    needs: fetch
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*
          check-latest: true
          cache: pnpm
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .pnpm-store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --offline --frozen-lockfile --recursive
      - run: pnpm run lint

  test:
    runs-on: ubuntu-latest
    needs: fetch
    permissions:
      contents: read
      pull-requests: write # crap-gate PR comment
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*
          check-latest: true
          cache: pnpm
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .pnpm-store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --offline --frozen-lockfile --recursive
      - run: pnpm run test --watch=false --coverage
      - run: pnpm --filter ./worker/ run test --watch=false
      - uses: FabienDehopre/crap-gate/frontend@b31ed69e6265b49261af63392f5e17a1d6d6a35b # v1.0.0
        with:
          exclude: |
            worker/**

  e2e:
    runs-on: ubuntu-latest
    needs: fetch
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .pnpm-store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --offline --frozen-lockfile --recursive
      - run: pnpm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*
          check-latest: true
          cache: pnpm
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .pnpm-store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --offline --frozen-lockfile --recursive
      - run: pnpm run build
