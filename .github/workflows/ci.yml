name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "store-path=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ steps.pnpm-store.outputs.store-path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm fetch
      - run: du -sh "$(pnpm store path)"

  lint:
    runs-on: ubuntu-latest
    needs: fetch
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: lts/*
          check-latest: true
          cache: pnpm
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "store-path=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ steps.pnpm-store.outputs.store-path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --offline --frozen-lockfile --recursive
      - run: pnpm run lint

  test:
    runs-on: ubuntu-latest
    needs: fetch
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: lts/*
          check-latest: true
          cache: pnpm
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "store-path=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ steps.pnpm-store.outputs.store-path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --offline --frozen-lockfile --recursive
      - run: pnpm run test --watch=false
      - run: pnpm --filter ./worker/ run test --watch=false

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          run_install: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: lts/*
          check-latest: true
          cache: pnpm
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "store-path=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ steps.pnpm-store.outputs.store-path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --offline --frozen-lockfile --recursive
      - run: pnpm run build
